<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Big Tracing Letter 'A' -->
  <g transform="translate(6, 4)">
    <!-- Base Letter A -->
    <path d="M19 4 L8 46 L17 46 L20 34 L32 34 L35 46 L44 46 L33 4 Z M26 14 L30 27 L22 27 Z" 
          fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Tracing dotted guide lines inside letter -->
    <path d="M26 10 L14 42" stroke="#6366F1" stroke-width="2" stroke-dasharray="2,3" stroke-linecap="round"/>
    <path d="M26 10 L38 42" stroke="#6366F1" stroke-width="2" stroke-dasharray="2,3" stroke-linecap="round"/>
    <path d="M18 30 L34 30" stroke="#6366F1" stroke-width="2" stroke-dasharray="2,3" stroke-linecap="round"/>
  </g>

  <!-- Angled Pencil Writing on the A -->
  <g transform="translate(30, 18) rotate(40)">
    <!-- Pencil Eraser -->
    <rect x="0" y="0" width="7" height="6" rx="2" fill="#F43F5E" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="5" width="7" height="3" fill="#CBD5E1" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Pencil Body -->
    <rect x="0" y="8" width="7" height="18" fill="#EC4899" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="2.5" y1="8" x2="2.5" y2="26" stroke="#DB2777" stroke-width="1"/>
    <!-- Wood Tip -->
    <polygon points="0,26 7,26 3.5,33" fill="#FDE047" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Lead -->
    <polygon points="2,30 5,30 3.5,33" fill="#1E293B"/>
  </g>
</svg>
