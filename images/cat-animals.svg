<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Lion Mane (Scalloped flower/petal cloud) -->
  <g fill="#EA580C" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="32" cy="14" r="8"/>
    <circle cx="45" cy="18" r="8"/>
    <circle cx="52" cy="30" r="8"/>
    <circle cx="49" cy="44" r="8"/>
    <circle cx="38" cy="52" r="8"/>
    <circle cx="26" cy="52" r="8"/>
    <circle cx="15" cy="44" r="8"/>
    <circle cx="12" cy="30" r="8"/>
    <circle cx="19" cy="18" r="8"/>
    <circle cx="32" cy="33" r="21" fill="#EA580C"/>
  </g>

  <!-- Left & Right Ears -->
  <circle cx="20" cy="18" r="5" fill="#FACC15" stroke="#1E293B" stroke-width="2"/>
  <circle cx="20" cy="18" r="2.5" fill="#FDA4AF"/>
  <circle cx="44" cy="18" r="5" fill="#FACC15" stroke="#1E293B" stroke-width="2"/>
  <circle cx="44" cy="18" r="2.5" fill="#FDA4AF"/>

  <!-- Face Circle -->
  <circle cx="32" cy="34" r="17" fill="#FACC15" stroke="#1E293B" stroke-width="2"/>

  <!-- Cheeks -->
  <circle cx="23" cy="38" r="2.5" fill="#FB923C" opacity="0.6"/>
  <circle cx="41" cy="38" r="2.5" fill="#FB923C" opacity="0.6"/>

  <!-- Eyes -->
  <circle cx="26" cy="31" r="2.2" fill="#1E293B"/>
  <circle cx="27" cy="30" r="0.8" fill="#FFFFFF"/>
  <circle cx="38" cy="31" r="2.2" fill="#1E293B"/>
  <circle cx="39" cy="30" r="0.8" fill="#FFFFFF"/>

  <!-- Nose & Mouth -->
  <polygon points="30,35 34,35 32,38" fill="#7C2D12"/>
  <path d="M29 39 Q32 42 35 39" fill="none" stroke="#7C2D12" stroke-width="1.8" stroke-linecap="round"/>
</svg>
